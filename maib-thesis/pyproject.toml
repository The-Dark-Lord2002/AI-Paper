[project]
name = "maib-thesis"
version = "1.0.0"
description = "Classification of marine incident reports with BERT, BiLSTM and attention (code of the paper)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.3",
    "transformers>=4.56",
    "datasets>=2.18",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy",
    "matplotlib",
    "tqdm",
]

# Scripts, not an installable package: `uv sync` only installs the dependencies.
[tool.uv]
package = false

# PyTorch with CUDA (NVIDIA GPU) on Windows and Linux; macOS gets the normal CPU/MPS build.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
