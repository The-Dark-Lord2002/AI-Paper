[project]
name = "bert-bilstm-marine-accidents"
version = "0.1.0"
description = "BERT + BiLSTM incident-type classifier for the MAIB marine incident reports dataset"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.19",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "mlxtend>=0.23",
]

[tool.uv]
package = false
