# Conda environment (Miniconda or Miniforge); every package comes from conda-forge, nothing from PyPI.
#   conda env create -f environment.yml
#   conda activate maib-bert-pretraining
# pytorch-gpu: conda chooses the CUDA build that the installed NVIDIA driver supports.
name: maib-bert-pretraining
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pytorch-gpu>=2.3
  - transformers>=4.56
  - huggingface_hub
  - scikit-learn>=1.3
  - pandas>=2.0
  - numpy
  - tqdm
  - requests      # step 0: download from gov.uk
  - pypdf         # step 2: read PDF files
  - openpyxl      # step 2: read .xlsx files
